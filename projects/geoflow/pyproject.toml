[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geoflow-gps-studio"
version = "1.0.0"
description = "An offline GPS quality workspace: CSV validation, audited interpolation and GIS exports."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Muhammad Kamran"}]
readme = "README.md"
keywords = ["gis", "geospatial", "gps", "data-quality", "geojson", "geopackage"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: OSI Approved :: MIT License",
]

[project.scripts]
geoflow = "geoflow.cli:main"

[tool.setuptools.packages.find]
include = ["geoflow*"]

[tool.setuptools.package-data]
geoflow = ["static/*"]
